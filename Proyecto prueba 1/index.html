<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasti — Cada peso bajo control</title>
    <meta name="description"
        content="Gasti: controla tus gastos hormiga, gastos diarios y suscripciones recurrentes. Cada peso bajo control.">
    <meta name="theme-color" content="#09090B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- AUTH -->
    <section id="auth" class="auth" hidden>
        <div class="auth-art" aria-hidden="true">
            <div class="orb orb-a"></div>
            <div class="orb orb-b"></div>
            <div class="brand brand-lg"><span class="brand-mark">G</span><span>Gasti</span></div>
            <h2>Cada peso<br><em>bajo control.</em></h2>
            <p>Descubre a dónde se va tu dinero, controla tus suscripciones y recibe avisos antes de cada cobro.</p>
        </div>
        <div class="auth-panel">
            <form id="authForm" class="auth-card glass" novalidate>
                <div class="tabs" role="tablist">
                    <button type="button" role="tab" class="tab is-active" data-mode="login" id="tabLogin">Iniciar
                        sesión</button>
                    <button type="button" role="tab" class="tab" data-mode="signup" id="tabSignup">Crear cuenta</button>
                </div>
                <label class="field" id="nameField" hidden><span>Nombre</span><input id="authName" autocomplete="name"
                        placeholder="Tu nombre"></label>
                <label class="field"><span>Correo</span><input id="authEmail" type="email" autocomplete="email"
                        placeholder="tu@correo.com" required></label>
                <label class="field"><span>Contraseña</span><input id="authPass" type="password"
                        autocomplete="current-password" placeholder="Mínimo 8 caracteres" required></label>
                <p class="form-error" id="authError" role="alert" hidden></p>
                <button class="btn btn-primary btn-block" id="authSubmit" type="submit">Entrar</button>
                <p class="hint">La autenticación con Supabase aún no está conectada. Por ahora, tus datos se guardan
                    solo en este navegador.</p>
                <button class="btn btn-ghost btn-block" id="demoBtn" type="button">Explorar con datos de
                    ejemplo</button>
            </form>
        </div>
    </section>

    <!-- APP -->
    <div id="app" class="app" hidden>
        <aside class="sidebar" id="sidebar">
            <div class="brand"><span class="brand-mark">G</span><span>Gasti</span></div>
            <nav aria-label="Principal" class="nav" id="nav"></nav>
            <div class="side-foot">
                <div class="mini-user"><span class="avatar" id="sideAvatar">G</span>
                    <div><strong id="sideName">Usuario</strong><small id="sideEmail"></small></div>
                </div>
            </div>
        </aside>

        <div class="main">
            <header class="topbar">
                <div class="brand brand-top"><span class="brand-mark">G</span></div>
                <div class="search-wrap">
                    <svg class="ico">
                        <use href="#i-search" />
                    </svg>
                    <input id="globalSearch" type="search" placeholder="Buscar gastos…" aria-label="Buscar gastos">
                </div>
                <div class="top-actions">
                    <button class="icon-btn" id="bellBtn" aria-label="Notificaciones"><svg class="ico">
                            <use href="#i-bell" />
                        </svg><span class="dot" id="bellDot" hidden></span></button>
                    <button class="btn btn-primary" id="addExpenseTop"><svg class="ico">
                            <use href="#i-plus" />
                        </svg><span>Registrar gasto</span></button>
                </div>
            </header>
            <main id="view" class="view" tabindex="-1"></main>
        </div>

        <nav class="bottom-nav" id="bottomNav" aria-label="Móvil"></nav>
        <button class="fab" id="fab" aria-label="Registrar gasto"><svg class="ico">
                <use href="#i-plus" />
            </svg></button>
    </div>

    <div id="modalRoot"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- ICONS -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-dash" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="9" rx="2" />
                <rect x="14" y="3" width="7" height="5" rx="2" />
                <rect x="14" y="12" width="7" height="9" rx="2" />
                <rect x="3" y="16" width="7" height="5" rx="2" />
            </symbol>
            <symbol id="i-wallet" viewBox="0 0 24 24">
                <path d="M3 7a2 2 0 0 1 2-2h13v4" />
                <path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-1z" />
                <circle cx="16.5" cy="14" r="1" />
            </symbol>
            <symbol id="i-repeat" viewBox="0 0 24 24">
                <path d="M17 2l4 4-4 4" />
                <path d="M3 11V9a3 3 0 0 1 3-3h15" />
                <path d="M7 22l-4-4 4-4" />
                <path d="M21 13v2a3 3 0 0 1-3 3H3" />
            </symbol>
            <symbol id="i-chart" viewBox="0 0 24 24">
                <path d="M3 3v18h18" />
                <path d="M7 15l4-5 3 3 5-7" />
            </symbol>
            <symbol id="i-bell" viewBox="0 0 24 24">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.9 1.9 0 0 0 3.4 0" />
            </symbol>
            <symbol id="i-gear" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
            </symbol>
            <symbol id="i-search" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <path d="M21 21l-4.3-4.3" />
            </symbol>
            <symbol id="i-edit" viewBox="0 0 24 24">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
            </symbol>
            <symbol id="i-trash" viewBox="0 0 24 24">
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 14h10l1-14" />
            </symbol>
            <symbol id="i-up" viewBox="0 0 24 24">
                <path d="M7 17L17 7M8 7h9v9" />
            </symbol>
            <symbol id="i-down" viewBox="0 0 24 24">
                <path d="M7 7l10 10M17 8v9H8" />
            </symbol>
            <symbol id="i-x" viewBox="0 0 24 24">
                <path d="M18 6L6 18M6 6l12 12" />
            </symbol>
            <symbol id="i-logout" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="M16 17l5-5-5-5M21 12H9" />
            </symbol>
            <symbol id="i-food" viewBox="0 0 24 24">
                <path d="M4 3v8a2 2 0 0 0 2 2v8M8 3v8M6 3v8M17 21V3c-3 2-4 5-4 8h4" />
            </symbol>
            <symbol id="i-car" viewBox="0 0 24 24">
                <path d="M5 17h14v-5l-2-5H7l-2 5z" />
                <circle cx="8" cy="17" r="1.5" />
                <circle cx="16" cy="17" r="1.5" />
            </symbol>
            <symbol id="i-play" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M10 8.5l5 3.5-5 3.5z" />
            </symbol>
            <symbol id="i-bag" viewBox="0 0 24 24">
                <path d="M5 8h14l-1 12H6z" />
                <path d="M9 8a3 3 0 0 1 6 0" />
            </symbol>
            <symbol id="i-bolt" viewBox="0 0 24 24">
                <path d="M13 2L4 14h7l-1 8 9-12h-7z" />
            </symbol>
            <symbol id="i-dots" viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="1" />
                <circle cx="12" cy="12" r="1" />
                <circle cx="19" cy="12" r="1" />
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="M5 12l5 5 9-10" />
            </symbol>
            <symbol id="i-clock" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
            </symbol>
        </defs>
    </svg>
    <script src="script.js"></script>
</body>

</html>
